[project]
name = "prebuilt"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6",
    "manifold3d>=3.0",              # plates: STL booleans
    "trimesh>=4.0",                 # plates: mesh export and checks
    "matplotlib>=3.8",              # paper target, figures
    "opencv-python-headless>=4.9",  # scanner
]

[project.optional-dependencies]
dev = ["pytest>=8"]
warp = ["warp-lang>=1.18"]  # sim/warp_sim.py; fast on a CUDA GPU, also runs on CPU

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]  # flat layout: name the packages so the editable install works
py-modules = ["contracts", "run"]

[tool.setuptools.packages.find]
include = ["agents*", "arms*", "eval*", "measure*", "model*", "network*", "plates*", "prereg*", "receipts*", "sim*", "viewer*"]
